project:
  name: sensorbudget
  random_seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  timestamp_column: date
  target_column: Occupancy
  id_column: source_row_id
  preserve_supplied_splits: true

features:
  sensor_columns:
    - Temperature
    - Humidity
    - Light
    - CO2
    - HumidityRatio
  add_calendar_features: false
  add_lag_features: false
  feature_sets:
    all_sensors:
      - Temperature
      - Humidity
      - Light
      - CO2
      - HumidityRatio
    no_light:
      - Temperature
      - Humidity
      - CO2
      - HumidityRatio

model:
  candidates:
    - dummy_prior
    - logistic_regression
    - decision_tree
    - random_forest
    - hist_gradient_boosting

evaluation:
  primary_metric: f1
  chronological_cv_splits: 5
  decision_threshold: 0.5
  metrics:
    - precision
    - recall
    - f1
    - balanced_accuracy
    - average_precision
    - roc_auc
