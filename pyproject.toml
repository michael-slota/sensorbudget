[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorbudget"
version = "0.1.0"
description = "Robust, cost-aware occupancy detection from environmental sensors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "plotly>=5.22",
    "scikit-learn>=1.4",
    "ucimlrepo>=0.0.7",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
explain = [
    "shap>=0.45",
]
app = [
    "dash>=3.0",
]

[project.scripts]
sensorbudget-build-data = "sensorbudget.data.build:main"
sensorbudget-validate-data = "sensorbudget.data.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
